plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

// Prefer android/key.properties (Play Store standard); fall back to local.properties.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
} else {
    keystoreProperties = localProperties
}

def hasReleaseSigning = keystoreProperties.getProperty("storeFile") &&
        keystoreProperties.getProperty("storePassword") &&
        keystoreProperties.getProperty("keyAlias") &&
        keystoreProperties.getProperty("keyPassword")

android {
    namespace "sa.kayan.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "sa.kayan.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        // Prefer Flutter --build-name / --build-number (from pubspec) over local.properties.
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
        manifestPlaceholders = [
            MAPS_API_KEY: localProperties.getProperty("MAPS_API_KEY") ?: ""
        ]
    }

    // ── Signing Config (Google Play) ──────────────────────────
    // 1. ./scripts/create_upload_keystore.sh
    // 2. cp android/key.properties.example android/key.properties  (fill secrets)
    // 3. ./scripts/build_play_bundle.sh
    // See docs/PLAY_STORE.md
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile     file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias      keystoreProperties.getProperty("keyAlias")
                keyPassword   keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    packagingOptions {
        exclude "META-INF/DEPENDENCIES"
        exclude "META-INF/LICENSE"
        exclude "META-INF/LICENSE.txt"
        exclude "META-INF/NOTICE"
        exclude "META-INF/NOTICE.txt"
    }

    lint {
        disable "InvalidPackage"
    }
}

// Fail release/bundle tasks when upload keystore is missing (never fall back to debug).
gradle.taskGraph.whenReady { graph ->
    def needsSigning = graph.allTasks.any { t ->
        def n = t.name.toLowerCase()
        n.contains("releas") && (n.contains("assemble") || n.contains("bundle") || n.contains("appbundle"))
    }
    if (needsSigning && !hasReleaseSigning) {
        throw new GradleException(
            "Missing android/key.properties (storeFile/storePassword/keyAlias/keyPassword). " +
            "Copy key.properties.example and create an upload keystore — see docs/PLAY_STORE.md"
        )
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.android.play:core:1.10.3"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.15.0"
        force "androidx.core:core-ktx:1.15.0"
        force "androidx.activity:activity:1.9.3"
        force "androidx.activity:activity-ktx:1.9.3"
        force "androidx.browser:browser:1.8.0"
    }
}
